services:
  - type: web
    name: predictcup-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run prisma:generate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: predictcup-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app

  - type: pserv
    name: predictcup-db
    env: postgresql
    region: oregon
    plan: free
