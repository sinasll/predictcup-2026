services:
  - type: web
    name: predictcup-backend
    runtime: node
    region: oregon
    plan: free

    buildCommand: cd backend && npm install && npm run prisma:generate
    startCommand: cd backend && npm start

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: predictcup-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app

databases:
  - name: predictcup-db
    region: oregon
    plan: free
